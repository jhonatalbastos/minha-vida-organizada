<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F1F5F9;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- White card background -->
  <rect x="96" y="120" width="320" height="280" rx="24" ry="24" fill="url(#card)" filter="url(#shadow)"/>

  <!-- Calendar header -->
  <rect x="96" y="120" width="320" height="56" rx="24" ry="24" fill="#2563EB" opacity="0.9"/>
  <rect x="96" y="152" width="320" height="24" fill="#2563EB" opacity="0.9"/>

  <!-- Calendar dots on header -->
  <circle cx="148" cy="148" r="3" fill="#93C5FD"/>
  <circle cx="168" cy="148" r="3" fill="#93C5FD"/>
  <circle cx="188" cy="148" r="3" fill="#93C5FD"/>

  <!-- Calendar month text -->
  <text x="256" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">22 SEM</text>

  <!-- Calendar grid lines -->
  <line x1="130" y1="200" x2="382" y2="200" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="130" y1="240" x2="382" y2="240" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="130" y1="280" x2="382" y2="280" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="130" y1="320" x2="382" y2="320" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Calendar day labels -->
  <text x="145" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">S</text>
  <text x="189" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">T</text>
  <text x="233" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Q</text>
  <text x="277" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Q</text>
  <text x="321" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">S</text>
  <text x="365" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">S</text>

  <!-- Calendar numbers (sample week) -->
  <text x="145" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">3</text>
  <text x="189" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">4</text>
  <text x="233" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">5</text>
  <text x="277" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">6</text>

  <!-- Today highlight (day 6) -->
  <circle cx="277" cy="250" r="16" fill="#2563EB"/>
  <text x="277" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white">6</text>

  <text x="321" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">7</text>
  <text x="365" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">8</text>

  <!-- Checkmark icon on calendar -->
  <circle cx="280" cy="300" r="20" fill="#16A34A"/>
  <path d="M268 300 L276 308 L292 292" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dumbbell icon -->
  <g transform="translate(160, 292)">
    <rect x="0" y="4" width="44" height="8" rx="4" fill="#2563EB"/>
    <rect x="-6" y="-2" width="10" height="20" rx="3" fill="#3B82F6"/>
    <rect x="40" y="-2" width="10" height="20" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Water drop icon -->
  <g transform="translate(330, 300)">
    <path d="M0 8 C0 8 -8 0 -8 -4 C-8 -8 -4 -8 -2 -12 C-1 -14 0 -16 0 -18 C0 -16 1 -14 2 -12 C4 -8 8 -8 8 -4 C8 0 0 8 0 8Z" fill="#3B82F6" transform="scale(0.9)"/>
  </g>

  <!-- Decorative stars -->
  <circle cx="380" cy="140" r="3" fill="#93C5FD" opacity="0.6"/>
  <circle cx="120" cy="400" r="4" fill="#A78BFA" opacity="0.4"/>

  <!-- Bottom gradient accent -->
  <rect x="96" y="372" width="320" height="28" rx="0" ry="0" fill="#2563EB" opacity="0.08"/>
  <rect x="96" y="376" width="320" height="24" rx="0" ry="0" fill="#2563EB" opacity="0.05"/>
</svg>

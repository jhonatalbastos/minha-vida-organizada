name: 📱 Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Aceitar licenças do Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          yes | "$SDK_ROOT/tools/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: 🖼️ Gerar ícones PNG placeholder
        run: |
          cd app
          mkdir -p icons
          node -e "
          const fs = require('fs');
          const png = Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAMAAABlAp8mAAAAA1BMVEX///+nxBvIAAAASElE' +
            'QVR4nO3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
            'AAAAAAAAAAAAAAAAAAAAAAD+BqgAAAH5U9ZWAAAAAElFTkSuQmCC',
            'base64'
          );
          fs.writeFileSync('icons/icon-192.png', png);
          fs.writeFileSync('icons/icon-512.png', png);
          console.log('✓ Ícones criados');
          "

      - name: 📦 Instalar Capacitor
        run: |
          cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/preferences

      - name: 🏗️ Preparar arquivos do app
        run: |
          cd app
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icons www/

      - name: 🏗️ Inicializar Capacitor para Android
        run: |
          cd app
          npx cap init "Minha Vida Organizada" "com.jhona.organizacao" --web-dir www
          npx cap add android
          npx cap sync android

      - name: 🔧 Corrigir conflito de versões do Kotlin
        run: |
          cd app/android
          sed -i 's/kotlin_version = .*/kotlin_version = "1.8.22"/' build.gradle
          node -e "
          const fs = require('fs');
          let c = fs.readFileSync('app/build.gradle', 'utf8');
          const b = 'configurations.all {\n' +
            '    exclude group: \"org.jetbrains.kotlin\", module: \"kotlin-stdlib-jdk7\"\n' +
            '    exclude group: \"org.jetbrains.kotlin\", module: \"kotlin-stdlib-jdk8\"\n' +
            '}\n\n';
          c = c.replace(/^android \{/m, b + 'android {');
          fs.writeFileSync('app/build.gradle', c);
          "
          echo "✅ Conflito de dependências do Kotlin resolvido"

      - name: 📱 Injetar Widget Android
        run: |
          cd app/android

          # === 1) Criar diretórios necessários ===
          mkdir -p app/src/main/java/com/jhona/organizacao/widget
          mkdir -p app/src/main/java/com/jhona/organizacao/plugin
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # === 2) Copiar arquivos do widget ===
          # NOTA: de app/android/, ../android-widget/ sobe para app/android-widget/
          cp ../android-widget/java/com/jhona/organizacao/widget/RoutineWidgetProvider.java \
             app/src/main/java/com/jhona/organizacao/widget/
          cp ../android-widget/res/layout/widget_layout_minimal.xml \
             app/src/main/res/layout/
          cp ../android-widget/res/xml/appwidget_provider_info.xml \
             app/src/main/res/xml/

          # === 2b) Regra ProGuard para não remover a classe do widget ===
          echo "-keep class com.jhona.organizacao.widget.** { *; }" >> app/proguard-rules.pro
          echo "✅ Regras ProGuard adicionadas"

          echo "✅ Arquivos do widget copiados"

          # === 3) Registrar widget no AndroidManifest.xml ===
          MANIFEST="app/src/main/AndroidManifest.xml"
          node -e "
          const fs = require('fs');
          let m = fs.readFileSync('$MANIFEST', 'utf8');
          const widgetReceiver = '    <!-- Widget da rotina diária -->\n' +
            '    <receiver android:name=\"com.jhona.organizacao.widget.RoutineWidgetProvider\"\n' +
            '        android:exported=\"false\">\n' +
            '        <intent-filter>\n' +
            '            <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />\n' +
            '        </intent-filter>\n' +
            '        <meta-data\n' +
            '            android:name=\"android.appwidget.provider\"\n' +
            '            android:resource=\"@xml/appwidget_provider_info\" />\n' +
            '    </receiver>\n';
          m = m.replace('</application>', widgetReceiver + '</application>');
          fs.writeFileSync('$MANIFEST', m);
          "
          echo "✅ Widget registrado no AndroidManifest.xml"

          echo "📱 Widget Android injetado com sucesso!"

      - name: 🧹 Limpar cache do Gradle
        run: |
          cd app/android
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew clean --no-daemon -Dorg.gradle.jvmargs=-Xmx2g || true

      - name: 🔨 Compilar APK
        run: |
          cd app/android
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: 🔏 Assinar APK
        run: |
          cd app/android
          
          # Criar keystore de debug
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug, OU=Android, O=MinhaVida, L=Cidade, ST=Estado, C=BR" 2>/dev/null || true
          
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ 2>/dev/null | tail -1)
            APKSIGNER="${BUILD_TOOLS}apksigner"
            [ ! -f "$APKSIGNER" ] && APKSIGNER=$(which apksigner 2>/dev/null || echo "")
            
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks ~/.android/debug.keystore \
                --ks-pass pass:android --ks-key-alias androiddebugkey \
                --out "$APK_DIR/MinhaVida-Organizada.apk" \
                "$APK_DIR/app-release-unsigned.apk"
              echo "✅ APK assinado com sucesso!"
            else
              cp "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/MinhaVida-Organizada.apk"
              echo "⚠️ APK copiado sem assinatura"
            fi
          else
            echo "⚠️ APK não encontrado em release, procurando em debug..."
            APK_DIR="app/build/outputs/apk/debug"
            if [ -f "$APK_DIR/app-debug.apk" ]; then
              cp "$APK_DIR/app-debug.apk" "$APK_DIR/MinhaVida-Organizada.apk"
              echo "✅ APK debug copiado"
            else
              echo "❌ Nenhum APK encontrado!"
              find app -name "*.apk" 2>/dev/null | head -5
            fi
          fi

      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaVida-Organizada-APK
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
